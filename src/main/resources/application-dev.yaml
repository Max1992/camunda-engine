server:
  port: 5001

camunda.bpm:
  admin-user:
    id: admin
    password: admin
  filter:
    create: All Tasks
  database:
    schema-update: true

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

logging:
  level:
    root: INFO
    # Уровень для SQL-запросов Hibernate (если используете JPA)
    org.hibernate.SQL: DEBUG
    # Уровень для отображения значений параметров (вместо знаков вопроса ?)
    org.hibernate.orm.jdbc.bind: TRACE
    # Специфичные логи для Camunda (SQL-запросы движка)
    org.camunda.bpm.engine.persistence: INFO