server:
  port: 5001

camunda.bpm:
# отключение стандартных средств camunda по деплою
  deployment-resource-pattern: []

# ручной деплой схем
  deploy:
    path: bpmn
    auto-deploy: true
  admin-user:
    id: admin
    password: admin
  filter:
    create: All Tasks
  database:
    schema-update: true
# процесс очистки переменных процессов
# которые завершились более TTL время
  generic-properties:
    history-cleanup-batch-window-start-time: "00:00"
    history-cleanup-batch-window-end-time: "06:00"
    properties:
      # Позволяет Job Executor выполнять асинхронные таски
      # даже без явной локальной регистрации приложения
      job-executor-deployment-aware: false

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

logging:
  level:
    root: INFO
    # Уровень для SQL-запросов Hibernate (если используете JPA)
    org.hibernate.SQL: DEBUG
    # Уровень для отображения значений параметров (вместо знаков вопроса ?)
    org.hibernate.orm.jdbc.bind: TRACE
    # Специфичные логи для Camunda (SQL-запросы движка)
    org.camunda.bpm.engine.persistence: INFO
    org.camunda.bpm.engine.repository: DEBUG
    org.camunda.bpm.engine.impl.cfg: INFO
    org.camunda.bpm.application: INFO